project: fixture-ts-browser-game
languages: [ts]
kind: consumers
trap: true
question: >
  Кто загружает и вызывает уровень src/game/levels/level1.ts (функция по умолчанию buildLevel)?
target:
  file: src/game/levels/level1.ts
  symbol: buildLevel
  line: 3
direction: incoming
match: line
line_tolerance: 0
edges:
  - rel: import
    expect: must
    from: {file: src/game/game.ts, line: 64, symbol: Game.loadLevel}
    confidence: high
    how: "await import(\"./levels/level1\") — динамический импорт с литералом; ADR-006 8.3: import(\"литерал\") → imports."
  - rel: call
    expect: may
    from: {file: src/game/game.ts, line: 65, symbol: Game.loadLevel}
    confidence: high
    how: "level.default(this) — тип level выводится из динамического импорта; default → buildLevel. Статический разбор не обязан связывать."
  - rel: import
    expect: may
    from: {file: src/game/game.ts, line: 68, symbol: Game.loadLevel}
    confidence: high
    how: "import(`./levels/level${index}.ts`) — шаблонная строка: подходят level1.ts и level2.ts; статически не определить (unresolved dynamic)."
  - rel: call
    expect: may
    from: {file: src/game/game.ts, line: 69, symbol: Game.loadLevel}
    confidence: high
    how: "level.default(this) после шаблонного импорта."
  - rel: call
    expect: may
    from: {file: src/game/main.ts, line: 16}
    confidence: high
    how: "game.loadLevel(1) — вход в цепочку (транзитивно, через Game.loadLevel)."
  # --- ловушка ---
  - rel: reference
    expect: must_not
    from: {file: src/game/levels/level2.ts, line: 3, symbol: buildLevel}
    confidence: high
    how: "Одноимённая функция по умолчанию в level2.ts."
notes: >
  Литеральный динамический импорт — must (ADR-006 обещает ребро imports); вызов через level.default и шаблонный
  импорт — may. Запись main.ts:16 — транзитивное звено.
