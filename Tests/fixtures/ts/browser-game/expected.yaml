id: ts-browser-game-01-util-format-trap
project: fixture-ts-browser-game
languages: [ts, js]
kind: consumers
trap: true
question: >
  Кто вызывает функцию format из src/util/format.ts (формат счёта с разделителем тысяч)? В src/game/ui/format.ts
  есть одноимённая функция format (формат времени) — она другая.
target:
  file: src/util/format.ts
  symbol: format
  line: 1
direction: incoming
match: line
line_tolerance: 0
edges:
  - rel: call
    expect: must
    from: {file: src/game/scoring.ts, line: 8, symbol: scoreLabel}
    confidence: high
    how: "import { format } from \"@util\" (стр. 1): paths @util → src/util/index.ts (из tsconfig.base.json через extends) → export { format } from \"./format\"."
  - rel: call
    expect: must
    from: {file: src/util/debug.js, line: 6, symbol: logScore}
    confidence: high
    how: "JS-файл импортирует TS-модуль без расширения: import { format } from \"./format\" (стр. 2) → src/util/format.ts."
  - rel: import
    expect: may
    from: {file: src/util/index.ts, line: 1}
    confidence: high
    how: "Реэкспорт export { format } from \"./format\" — звено цепочки, не вызов."
  - rel: import
    expect: may
    from: {file: src/game/scoring.ts, line: 1}
    confidence: high
    how: "Импорт символа через алиас @util и реэкспорт."
  - rel: import
    expect: may
    from: {file: src/util/debug.js, line: 2}
    confidence: high
    how: "Импорт из JS."
  - rel: test
    expect: may
    from: {file: tests/scoring.test.ts, line: 10}
    confidence: high
    how: "Тест scoreLabel проверяет результат format(\"Score: 12 345\") — транзитивно через scoreLabel."
  # --- ловушки: одноимённая функция в src/game/ui/format.ts ---
  - rel: call
    expect: must_not
    from: {file: src/game/ui/hud.ts, line: 16, symbol: Hud.draw}
    confidence: high
    how: "format(this.elapsed) — импорт из \"./format\" (стр. 1) = src/game/ui/format.ts."
  - rel: import
    expect: must_not
    from: {file: src/game/ui/hud.ts, line: 1}
    confidence: high
    how: "Импорт другого модуля format."
  - rel: reference
    expect: must_not
    from: {file: src/game/ui/format.ts, line: 1, symbol: format}
    confidence: high
    how: "Объявление одноимённой функции в другом модуле."
notes: >
  Проверяет: алиас tsconfig paths без звёздочки (@util), реэкспорт export { a } from, импорт TS из JS без расширения.
  grep «format(» находит обе функции и их вызовы.
