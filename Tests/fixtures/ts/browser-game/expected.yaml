# Ожидаемый граф синтетической базы Tests/fixtures/ts/browser-game (F02-03).
# Формат — Bench/README.md («Формат эталона»); один YAML-документ (между `---`) = один эталон.
# Пути — от корня базы (папка этого файла), строки — с 1; line_tolerance: 0 — строки в синтетике точные,
# а соседние строки часто принадлежат разным записям (must рядом с must_not). confidence у синтетики всегда high.
# Символы TS: `Class.method`, свободная функция — `имя` (модуль различается по file).
