# Ожидаемый граф синтетической базы Tests/fixtures/go/arena (F02-03).
# Формат — Bench/README.md («Формат эталона»); один YAML-документ (между `---`) = один эталон.
# Пути — от корня базы (папка этого файла), строки — с 1; line_tolerance: 0 — строки в синтетике точные,
# а соседние строки часто принадлежат разным записям (must рядом с must_not). confidence у синтетики всегда high.
# Символы Go: `pkg.Func`, `pkg.Type`, `pkg.Type.Method` (получатель-значение), `pkg.(*Type).Method` (указатель),
# метод интерфейса — `pkg.Iface.Method`; модуль — example.com/arena (go.mod).
---
schema: 1
id: go-arena-01-entity-implicit-implementations
project: fixture-go-arena
languages: [go]
kind: implementations
trap: true
question: >
  Какие типы реализуют интерфейс entity.Entity (ID() int + Update(dt float64))? В Go реализация неявная — по
  набору методов.
target:
  file: entity/entity.go
  symbol: entity.Entity
  line: 12
direction: incoming
match: line
line_tolerance: 0
edges:
  - rel: implement
    expect: must
    from: {file: entity/player.go, line: 9, symbol: entity.Player}
    confidence: high
    how: "*Player: Update — свой метод (стр. 22), ID — продвинут из встроенного по значению Base ((*Base).ID, entity.go:24; для *Player доступен)."
  - rel: implement
    expect: must
    from: {file: entity/monster.go, line: 6, symbol: entity.Monster}
    confidence: high
    how: "*Monster: Update (стр. 19), ID — продвинут из встроенного указателя *Base. Передаётся как Entity в w.Add (world.go:84)."
  - rel: implement
    expect: must
    from: {file: game/world_test.go, line: 9, symbol: game_test.fakeEntity}
    confidence: high
    how: "Тестовая подделка во внешнем тестовом пакете game_test: ID (стр. 14) и Update (стр. 16); передаётся в w.Add(f) (стр. 21)."
  - rel: inherit
    expect: may
    from: {file: game/world.go, line: 14, symbol: game.Actor}
    confidence: high
    how: "Интерфейс Actor встраивает entity.Entity — расширение интерфейса, не реализация; строка — строка встраивания."
  # --- ловушки: «почти» реализации ---
  - rel: implement
    expect: must_not
    from: {file: entity/crate.go, line: 4, symbol: entity.Crate}
    confidence: high
    how: "Crate встраивает Base (есть ID), но метода Update нет."
  - rel: implement
    expect: must_not
    from: {file: ui/hud.go, line: 10, symbol: ui.HUD}
    confidence: high
    how: "HUD имеет Update(dt float64) с той же сигнатурой, но нет ID."
notes: >
  Неявные интерфейсы: слова implements в коде нет. ADR-006 8.4 строит implements в type_pass по набору методов
  (INFERRED 0.8), поэтому реализации — must. Для Monster нужен набор методов с учётом встраивания указателя.
