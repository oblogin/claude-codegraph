schema: 1
id: cs-asm-01-gameplay-settings-load
project: fixture-csharp-asmdef
languages: [csharp]
kind: consumers
trap: true
question: >
  Кто вызывает Game.Shared.Settings.Load из сборки Game.Gameplay (Assets/Gameplay/Settings.cs)?
target:
  file: Assets/Gameplay/Settings.cs
  symbol: "Settings.Load"
  line: 7
direction: incoming
match: line
line_tolerance: 0
edges:
  - rel: call
    expect: must
    from: {file: Assets/Scripts/GameBootstrap.cs, line: 13, symbol: "GameBootstrap.Run"}
    confidence: high
    how: "Assembly-CSharp (скрипт без asmdef) видит все сборки с autoReferenced: true — Game.Gameplay да, Game.Tools нет; Settings через using Game.Shared."
  - rel: call
    expect: must_not
    from: {file: Assets/Tools/SettingsTool.cs, line: 11, symbol: "SettingsTool.Apply"}
    confidence: high
    how: "Game.Tools не ссылается на Game.Gameplay; там Settings — свой класс Assets/Tools/Settings.cs с тем же полным именем."
notes: >
  Два класса с одинаковым полным именем Game.Shared.Settings в разных сборках; различает их только видимость
  сборок (ADR-006 §8.2).
