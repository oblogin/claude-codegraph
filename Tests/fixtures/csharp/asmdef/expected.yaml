# Ожидаемый граф синтетической базы Tests/fixtures/csharp/asmdef (F02-03): видимость сборок Unity.
# Формат — Bench/README.md, «Формат эталона»; один YAML-документ (---) = один эталон.
# Пути — от корня базы (папка этого файла). Строки проверены скриптом при составлении.
# Сборки: Game.Core (Assets/Core), Game.Gameplay → Core по имени, Game.UI → Core по GUID,
# Game.Tools → Core (autoReferenced: false), Assembly-CSharp (Assets/Scripts), Assembly-CSharp-Editor
# (Assets/Scripts/Editor), Assembly-CSharp-firstpass (Assets/Plugins), Game.Core.Tests (EditMode).
