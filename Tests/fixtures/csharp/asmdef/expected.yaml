schema: 1
id: cs-asm-07-core-asmdef-dependents
project: fixture-csharp-asmdef
languages: [csharp]
kind: consumers
trap: true
question: >
  Какие сборки зависят от Game.Core (ссылаются на Game.Core.asmdef)?
target:
  file: Assets/Core/Game.Core.asmdef
  symbol: "Game.Core"
  line: 2
direction: incoming
match: line
line_tolerance: 0
edges:
  - rel: import
    expect: must
    from: {file: Assets/Gameplay/Game.Gameplay.asmdef, line: 5, symbol: "Game.Gameplay"}
    confidence: high
    how: "references: \"Game.Core\" — по имени."
  - rel: import
    expect: must
    from: {file: Assets/UI/Game.UI.asmdef, line: 5, symbol: "Game.UI"}
    confidence: high
    how: "references: \"GUID:fe44…\" — по GUID из Game.Core.asmdef.meta; имени Game.Core в файле нет."
  - rel: import
    expect: must
    from: {file: Assets/Tools/Game.Tools.asmdef, line: 5, symbol: "Game.Tools"}
    confidence: high
    how: "references: \"Game.Core\"; сборка с autoReferenced: false сама на Core ссылаться может."
  - rel: import
    expect: must
    from: {file: Assets/Tests/EditMode/Game.Core.Tests.asmdef, line: 7, symbol: "Game.Core.Tests"}
    confidence: high
    how: "Тестовая сборка ссылается на Game.Core."
  - rel: import
    expect: must_not
    from: {file: Assets/Tests/EditMode/Game.Core.Tests.asmdef, line: 2, symbol: "Game.Core.Tests"}
    confidence: high
    how: "\"name\": \"Game.Core.Tests\" — совпадение префикса имени, а не ссылка."
notes: >
  Связь сборка → сборка (ADR-006: depends_on) в словаре Bench/README.md записана как import. Assembly-CSharp и
  Assembly-CSharp-Editor тоже зависят от Game.Core (неявно, через autoReferenced: true), но строки-ссылки у них
  нет, поэтому в эталон с match: line они не входят.
