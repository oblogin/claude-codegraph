# Ожидаемый граф синтетической базы Tests/fixtures/csharp/language (F02-03).
# Формат — Bench/README.md, «Формат эталона»; один YAML-документ (---) = один эталон.
# Пути — от корня базы (папка этого файла). Строки проверены скриптом при составлении.
# Символы C#: Класс.Член без пространства имён; перегрузки — со списком типов параметров;
# явная реализация — Класс.Интерфейс.Метод; дженерики — без параметров типа.
