schema: 1
id: cs-lang-01-shape-area-overrides
project: fixture-csharp-language
languages: [csharp]
kind: implementations
trap: true
question: >
  Какие методы переопределяют абстрактный Shape.Area()?
target:
  file: Inheritance/Shape.cs
  symbol: "Shape.Area"
  line: 8
direction: incoming
match: line
line_tolerance: 0
edges:
  - rel: override
    expect: must
    from: {file: Inheritance/Circle.cs, line: 14, symbol: "Circle.Area"}
    confidence: high
    how: "public override double Area() в Circle : Shape."
  - rel: override
    expect: must
    from: {file: Inheritance/Square.cs, line: 12, symbol: "Square.Area"}
    confidence: high
    how: "public override double Area() в Square : Shape."
  - rel: override
    expect: must
    from: {file: Inheritance/RoundedSquare.cs, line: 13, symbol: "RoundedSquare.Area"}
    confidence: high
    how: "RoundedSquare : Square : Shape — переопределение через два уровня (прямо переопределяет Square.Area, транзитивно — Shape.Area)."
  - rel: override
    expect: must_not
    from: {file: Traps/Room.cs, line: 10, symbol: "Room.Area"}
    confidence: high
    how: "Room.Area() — одноимённый метод класса, который не наследует Shape."
notes: >
  RoundedSquare.Area — must: отвечая «кто переопределяет Shape.Area», инструмент должен пройти цепочку баз.
