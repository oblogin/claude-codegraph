# Ожидаемый граф синтетической базы Tests/fixtures/rust/ecs-lite (F02-03).
# Формат — Bench/README.md («Формат эталона»); один YAML-документ (между `---`) = один эталон.
# Пути — от корня базы (папка этого файла), строки — с 1; line_tolerance: 0 — строки в синтетике точные,
# а соседние строки часто принадлежат разным записям (must рядом с must_not). confidence у синтетики всегда high.
# Символы Rust: `Type::method` (inherent), `<Type as Trait>::method` (реализация трейта), `Trait::method`
# (объявление в трейте, в том числе с телом по умолчанию), свободная функция — путь модуля `math::ops::clamp`,
# макрос — `vec2!`, блок impl — "impl Trait for Type". Крейт-библиотека ecs_lite (пакет ecs-lite), бинарник — src/main.rs.
