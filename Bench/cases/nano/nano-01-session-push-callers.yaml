notes: >
  Проверяет разрешение метода по типу получателя в Go: четыре типа с методом Push (Session, agent, acceptor,
  mock.NetworkEntity) и две функции с префиксом Push. Особый случай — параметр с именем session, совпадающим с
  именем пакета (node_test.go). Транзитивно Session.Push вызывается через Group.Broadcast/Multicast из примеров
  (см. nano-06) — в этот эталон не включено.
