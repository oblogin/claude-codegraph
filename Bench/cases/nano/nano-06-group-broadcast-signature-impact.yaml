notes: >
  Главная ловушка — продвижение метода через встраивание: в tadpole вызов записан как w.Broadcast, где w *World,
  а у World нет своего Broadcast. Инструмент, который ищет только «.group.Broadcast» или методы с получателем
  *Group, пропустит 3 вызова из 8. Тестов на Broadcast нет — хороший инструмент не должен их «придумывать».
