notes: >
  Трейт с пятью реализациями внутри крейта и параллельным трейтом Drawable3d с почти такой же сигнатурой
  (draw(&self, canvas: &mut Canvas3d, param: impl Into<DrawParam3d>)). grep «fn draw(&self, canvas» даёт 10 строк,
  из них 5 — нужные реализации. Примеры (examples/*.rs) Drawable не реализуют и Drawable::draw напрямую не вызывают
  (только через Canvas::draw), поэтому при сохранении сигнатуры Canvas::draw их менять не нужно.
