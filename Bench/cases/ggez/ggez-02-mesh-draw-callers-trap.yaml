question: >
  Кто вызывает <Mesh as Drawable>::draw? Методов draw в проекте много (EventHandler::draw, Canvas::draw,
  Canvas3d::draw, Drawable3d::draw, методы примеров, wgpu RenderPass::draw) — нужен только этот.
target:
  file: src/graphics/mesh.rs
  symbol: "<Mesh as Drawable>::draw"
  line: 246
direction: incoming
match: line
edges:
  - rel: call_interface
    expect: must
    from: {file: src/graphics/canvas.rs, line: 384, symbol: Canvas::draw}
    confidence: high
    how: "pub fn draw(&mut self, drawable: &impl Drawable, …) { drawable.draw(self, param) } — дженерик по Drawable; при canvas.draw(&mesh, …) мономорфизируется в вызов Mesh::draw. Основной путь."
  - rel: call
    expect: must
    from: {file: src/graphics/mesh.rs, line: 278, symbol: "<Quad as Drawable>::draw"}
    confidence: high
    how: "canvas.default_resources().mesh.clone().draw(canvas, param) — DefaultResources.mesh: Mesh (canvas.rs:583), прямой вызов конкретного Mesh::draw."
  - rel: call_interface
