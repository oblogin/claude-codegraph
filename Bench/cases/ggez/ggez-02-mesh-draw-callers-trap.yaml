notes: >
  Трейт-метод, реализованный пятью типами (Image, InstanceArray, Mesh, Quad, Text), плюс одноимённые draw у
  трейтов EventHandler/Drawable3d и у wgpu. Прямой конкретный вызов Mesh::draw один (из Quad::draw), остальные
  два — дженерики &impl Drawable, которые достигают Mesh::draw только при мономорфизации: мы засчитываем их как
  must (именно так вызывается Mesh::draw). Вызовы canvas.draw(&mesh, …) в примерах — транзитивные (через
  Canvas::draw) и в эталон не выписаны: при ответе инструмента считаются «лишними» и разбираются вручную.
