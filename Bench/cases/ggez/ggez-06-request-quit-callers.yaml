    how: "Пример в документации модуля (//! ```rust,no_run, стр. 27–104): ctx.request_quit() внутри key_down_event. no_run — компилируется как doc-тест, но не запускается; переименование метода сломает `cargo test --doc`."
  # --- ловушки ---
  - rel: call
    expect: must_not
    from: {file: src/event.rs, line: 165, symbol: EventHandler::key_down_event}
    confidence: high
    how: "Реализация по умолчанию НЕ вызывает request_quit: пишет напрямую HasMut::<ContextFields>::retrieve_mut(ctx).quit_requested = true (C — дженерик контекста, у него нет метода request_quit). Док-комментарий на стр. 160 («will call ctx.request_quit()») расходится с кодом."
  - rel: reference
    expect: must_not
    from: {file: src/event.rs, line: 160}
    confidence: high
    how: "Ссылка в док-комментарии [`ctx.request_quit()`](crate::Context::request_quit) — не вызов. То же context.rs:93, 96."
notes: >
  Ловушка «документация врёт»: агент, который доверяет комментарию, решит, что переименование request_quit
  затронет обработку Escape по умолчанию, — это не так (там прямое присваивание полю). Правильный ответ —
  6 вызовов в 4 примерах и один doc-тест (may, поскольку это пример в комментарии).
