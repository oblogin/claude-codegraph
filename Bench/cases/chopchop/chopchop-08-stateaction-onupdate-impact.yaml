notes: >
  30 переопределений StateAction.OnUpdate (29 в Characters/StateMachine/Actions/*SO.cs, все в классах «XxxAction : StateAction»,
  объявленных в тех же файлах, что и их XxxActionSO) и один вызов через базовый класс. Ловушки: одноимённый
  метод State.OnUpdate, отдельная иерархия NPCMovementAction с тем же именем абстрактного метода и член enum
  SpecificMoment.OnUpdate. grep «OnUpdate» даёт ~40 строк, из них 31 нужная.
  Тестов в проекте нет (нет сборок *.Tests и NUnit; Pool/Example/*Tester.cs — демонстрационные MonoBehaviour), тестовые файлы в эталон не входят.
