notes: >
  match: file — считаем затронутые файлы, а не строки (в тестах ~170 вызовов). Сам файл интерфейса
  (interfaces/loadable.ts) — это target, в список не входит. Правильный ответ: 9 файлов движка + 22 файла тестов.
  Главная сложность — тип получателя .load(): в тех же тестах и в движке есть DebugText.load, Engine.load,
  TextureLoader.load и DOM FontFace.load, которые переименовывать нельзя. Реализации Loadable в TS структурные:
  класс без «implements Loadable», но с методом load() тоже подошёл бы — таких в src/engine и src/spec нет
  (проверено поиском классов с методом load()).
