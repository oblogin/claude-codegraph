notes: >
  Хук вызывается движком из обработчика события, а само событие приходит через pipe() эмиттера коллайдера
  в эмиттер компонента. Прямой вызов один (стр. 276), остальная цепочка — may. В тестах метод подменяется
  через vi.spyOn(actor, 'onCollisionStart') — ссылка строкой-именем свойства, её видит только анализатор,
  понимающий типы vitest (keyof). Переопределения в пользовательском коде (sandbox/src/game.ts:711, 767)
  вне scope.
