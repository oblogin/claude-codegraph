  file: src/engine/graphics/image-source.ts
  symbol: ImageSource.load
  line: 240
direction: incoming
match: line
scope: [src/engine/]
edges:
  - rel: call
    expect: must
    from: {file: src/engine/graphics/context/debug-text.ts, line: 42, symbol: DebugText.load}
    confidence: high
    how: "this._imageSource.load(); поле _imageSource: ImageSource (стр. 37), создаётся new ImageSource(...) на стр. 41."
  - rel: call
    expect: must
    from: {file: src/engine/graphics/sprite-sheet.ts, line: 221, symbol: SpriteSheet.getSpriteAsStandalone}
    confidence: high
