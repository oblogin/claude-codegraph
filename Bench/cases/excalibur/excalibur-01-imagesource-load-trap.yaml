notes: >
  Ловушка «одноимённые методы»: grep «\.load(» по src/engine даёт ~20 строк, из них 4 — вызовы ImageSource.load.
  Для разрешения нужен вывод типа получателя (поле, локальная переменная, параметр лямбды из map по массиву ImageSource[]).
  Вызов через интерфейс Loadable в DefaultLoader.load засчитан как must: ImageSource — один из шести классов,
  реализующих Loadable, и именно так картинки загружаются в играх. Тесты (src/spec) в scope не входят,
  см. excalibur-04.
