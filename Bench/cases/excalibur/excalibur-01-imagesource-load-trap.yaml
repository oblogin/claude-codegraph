  - rel: call
    expect: must
    from: {file: src/engine/resources/gif.ts, line: 65, symbol: Gif.load}
    confidence: high
    how: "images = this._gif.images.map(i => new ImageSource(...)); Promise.all(images.map((t) => t.load())) — t: ImageSource."
