question: >
  Кто вызывает Entity.onInitialize и кто его переопределяет? (В движке onInitialize есть ещё у Engine, Scene,
  Camera, Director и DefaultLoader — это другие методы.)
target:
  file: src/engine/entity-component-system/entity.ts
  symbol: Entity.onInitialize
  line: 604
direction: incoming
match: line
scope: [src/engine/]
edges:
  - rel: call_virtual
    expect: must
    from: {file: src/engine/entity-component-system/entity.ts, line: 542, symbol: Entity._initialize}
    confidence: high
    how: "this.onInitialize(engine) — виртуальный вызов; реально попадает в переопределения ниже."
  - rel: override
    expect: must
    from: {file: src/engine/actor.ts, line: 767, symbol: Actor.onInitialize}
    confidence: high
    how: "class Actor extends Entity (стр. 280); public override onInitialize."
  - rel: override
    expect: must
    from: {file: src/engine/director/cross-fade.ts, line: 34, symbol: CrossFade.onInitialize}
    confidence: high
    how: "CrossFade extends Transition (стр. 18), Transition extends Entity (transition.ts:54)."
  - rel: override
    expect: must
    from: {file: src/engine/director/fade-in-out.ts, line: 24, symbol: FadeInOut.onInitialize}
    confidence: high
    how: "FadeInOut extends Transition → Entity."
  - rel: override
    expect: must
    from: {file: src/engine/director/slide.ts, line: 63, symbol: Slide.onInitialize}
    confidence: high
    how: "Slide extends Transition → Entity."
  # --- непрямые звенья (кто вызывает _initialize) ---
