    confidence: high
    how: "await this.onInitialize(engine) — Engine.onInitialize (стр. 1720). Рядом стр. 1739 — director.onInitialize() (Director.onInitialize, director.ts:179), тоже must_not."
  - rel: call
    expect: must_not
    from: {file: src/engine/scene.ts, line: 385, symbol: Scene._initialize}
    confidence: high
    how: "await this.onInitialize(engine) — Scene.onInitialize (стр. 265); Scene не наследует Entity (scene.ts:114)."
  - rel: call
    expect: must_not
    from: {file: src/engine/camera.ts, line: 689, symbol: Camera._initialize}
    confidence: high
    how: "this.onInitialize(engine) — Camera.onInitialize (стр. 700); class Camera implements CanUpdate, CanInitialize (стр. 264), не Entity."
notes: >
  Методы onInitialize есть у Entity (и 4 наследников), Engine, Scene, Camera, Director, DefaultLoader/Loader. grep «onInitialize(» по src/engine вне комментариев даёт 19 строк, нужных — 5.
  Правильный ответ требует иерархии классов: Transition → Entity, но Loader → DefaultLoader (не Entity),
  Scene/Camera/Engine реализуют интерфейс CanInitialize, а не наследуют Entity. Интерфейс CanInitialize
  (lifecycle-events.ts:103) объявляет тот же метод для Actor/Scene/Camera/Engine — связь через него в эталон
  не включена (структурная типизация TS: это «тот же» метод только для Actor).
