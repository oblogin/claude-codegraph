    expect: may
    from: {file: src/engine/entity-component-system/entity.ts, line: 654, symbol: Entity.update}
    confidence: high
    how: "this._initialize(engine) в начале update — ленивая инициализация сущности перед первым кадром."
  - rel: call
    expect: may
    from: {file: src/engine/actor.ts, line: 778, symbol: Actor._initialize}
    confidence: high
    how: "super._initialize(engine) и далее child._initialize (стр. 780)."
