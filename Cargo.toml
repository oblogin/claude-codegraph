[workspace]
members = [
    "crates/core",
    "crates/store",
    "crates/index",
    "crates/lang-csharp",
    "crates/lang-ts",
    "crates/lang-go",
    "crates/lang-rust",
    "crates/unity",
    "crates/markdown",
    "crates/query",
    "crates/refine",
    "crates/mcp",
    "crates/cli",
    "crates/testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# ADR-006 §5: MSRV as in ue-xray; the pinned toolchain is in rust-toolchain.toml.
rust-version = "1.93"
authors = ["oblogin"]
publish = false

[workspace.dependencies]
# Internal crates (ADR-006 §5).
codegraph-core = { path = "crates/core" }
codegraph-store = { path = "crates/store" }
codegraph-index = { path = "crates/index" }
codegraph-csharp = { path = "crates/lang-csharp" }
codegraph-ts = { path = "crates/lang-ts" }
codegraph-go = { path = "crates/lang-go" }
codegraph-rust = { path = "crates/lang-rust" }
codegraph-unity = { path = "crates/unity" }
codegraph-markdown = { path = "crates/markdown" }
codegraph-query = { path = "crates/query" }
codegraph-refine = { path = "crates/refine" }
codegraph-mcp = { path = "crates/mcp" }

# External (versions as in ue-xray, ADR-006 §13). Grammars, rusqlite, rayon,
# ignore, xxhash-rust and smallvec are added when the first crate uses them.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

# Tests only.
tempfile = "3"

[profile.release]
# Hooks start a fresh process on every tool call: keep the binary lean.
lto = "thin"
codegen-units = 1
